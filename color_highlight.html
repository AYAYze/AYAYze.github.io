<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이미지 색상 테두리 감지</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: #f7f7f7;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin: 2rem;
    }
    canvas {
      border: 1px solid #aaa;
      cursor: crosshair;
      max-width: 90vw;
      height: auto;
    }
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    #selectedColorBox {
      width: 24px;
      height: 24px;
      border: 1px solid #888;
      border-radius: 4px;
    }
    input[type="range"] {
      width: 150px;
    }
  </style>
</head>
<body>
  <h1>🎨 이미지 색상 테두리 감지</h1>

  <div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <label>유사도: <input type="range" id="tolerance" min="0" max="100" value="10"></label>
    <div>선택 색상: <div id="selectedColorBox"></div></div>
    <button id="resetBtn">초기화</button>
  </div>

  <canvas id="canvas"></canvas>

  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
  <script>
    let img = new Image();
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imageInput = document.getElementById('imageInput');
    const toleranceInput = document.getElementById('tolerance');
    const resetBtn = document.getElementById('resetBtn');
    const selectedColorBox = document.getElementById('selectedColorBox');

    let cvLoaded = false;
    function onOpenCvReady() {
      cvLoaded = true;
      console.log('✅ OpenCV.js loaded');
    }

    // 이미지 업로드
    imageInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
    };

    // 이미지 클릭 → 색상 추출 및 즉시 테두리 표시
    canvas.addEventListener('click', e => {
      if (!cvLoaded) {
        alert("OpenCV.js가 아직 로드되지 않았습니다. 잠시 후 다시 시도하세요.");
        return;
      }
      if (!img.src) return;

      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
      const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));

      const pixel = ctx.getImageData(x, y, 1, 1).data;
      const selectedColor = { r: pixel[0], g: pixel[1], b: pixel[2] };
      selectedColorBox.style.backgroundColor = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
      console.log(`🎯 선택한 색상: R${pixel[0]} G${pixel[1]} B${pixel[2]}`);

      const tol = parseInt(toleranceInput.value);
      detectColorOutline(selectedColor, tol);
    });

    // 초기화 버튼
    resetBtn.addEventListener('click', () => {
      if (!img.src) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    });

    function detectColorOutline(targetColor, tolerance) {
      // 원본 다시 그리기
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      // 다음 프레임에서 OpenCV 처리
      requestAnimationFrame(() => {
        let src = cv.imread(canvas);
        let dst = new cv.Mat();
        let mask = new cv.Mat();

        let lower = new cv.Mat(src.rows, src.cols, src.type(), [
          Math.max(targetColor.r - tolerance, 0),
          Math.max(targetColor.g - tolerance, 0),
          Math.max(targetColor.b - tolerance, 0),
          0
        ]);
        let upper = new cv.Mat(src.rows, src.cols, src.type(), [
          Math.min(targetColor.r + tolerance, 255),
          Math.min(targetColor.g + tolerance, 255),
          Math.min(targetColor.b + tolerance, 255),
          255
        ]);

        cv.inRange(src, lower, upper, mask);

        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        src.copyTo(dst);
        for (let i = 0; i < contours.size(); ++i) {
          let color = new cv.Scalar(255, 0, 0, 255); // 빨간 테두리
          cv.drawContours(dst, contours, i, color, 1, cv.LINE_8, hierarchy, 0);
        }

        cv.imshow('canvas', dst);

        src.delete(); dst.delete(); mask.delete(); lower.delete(); upper.delete();
        contours.delete(); hierarchy.delete();
      });
    }
  </script>
</body>
</html>
